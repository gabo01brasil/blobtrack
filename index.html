<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Blob Filter</title>
<style>
@import url('https://db.onlinewebfonts.com/c/f18149d69a4651070f2f51e1c6c2485c?family=Africa+Trial+Cliff');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font:1rem/1.6 system-ui,sans-serif;text-align:center;padding:2rem;pointer-events:none}
#controls{position:fixed;bottom:0;left:0;right:0;display:none;flex-direction:column;gap:8px;background:rgba(0,0,0,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.12);padding:12px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));color:#fff;font:13px/1.2 system-ui,sans-serif;user-select:none}
.ctrl-sliders{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.ctrl-sliders label{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.ctrl-sliders label strong{min-width:28px;text-align:right;font-weight:600}
.ctrl-sliders input[type=range]{flex:1;min-width:0;accent-color:#fff;cursor:pointer}
.ctrl-btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg-group{display:inline-flex;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.segBtn{padding:5px 10px;border:none;border-radius:0;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font:12px system-ui,sans-serif;white-space:nowrap;transition:background .15s}
.segBtn+.segBtn{border-left:1px solid rgba(255,255,255,.2)}
.segBtn:hover{background:rgba(255,255,255,.2)}
.segBtn.active{background:rgba(255,255,255,.38)}
.ctrl-btns>button,#pauseBtn,#qrBtn{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font:13px system-ui,sans-serif;white-space:nowrap;transition:background .15s}
.ctrl-btns>button:hover,#pauseBtn:hover,#qrBtn:hover{background:rgba(255,255,255,.22)}
.ctrl-btns>button.active{background:rgba(80,140,255,.35);border-color:rgba(100,160,255,.6)}
#pauseBtn.paused{background:rgba(220,60,60,.35);border-color:rgba(220,80,80,.6)}
.ctrl-system{display:flex;align-items:center;gap:8px}
#cameraSelect{flex:1;min-width:0;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 28px 6px 12px;font:13px system-ui,sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3lsvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3lpath d='M0 0l5 6 5-6z' fill='%23fff'/%3E%3l/svg%3E");background-repeat:no-repeat;background-position:right 10px center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cameraSelect option{background:#1a1a1a;color:#fff}
@media(min-width:700px){#controls{bottom:20px;left:50%;right:auto;transform:translateX(-50%);border-top:none;border-radius:40px;border:1px solid rgba(255,255,255,.12);flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 20px;width:max-content;max-width:calc(100vw - 40px)}.ctrl-sliders{display:contents}.ctrl-sliders label{gap:6px}.ctrl-sliders input[type=range]{width:90px;flex:none}.ctrl-btns,.ctrl-system{gap:10px}#cameraSelect{flex:none;max-width:160px}}
#qrModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);align-items:center;justify-content:center;z-index:100}
#qrModal.open{display:flex}
#qrBox{background:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:90vw}
#qrImg{width:200px;height:200px;display:block}
#qrUrl{font:11px/1.4 monospace;color:#333;word-break:break-all;text-align:center;max-width:200px}
#qrClose{padding:7px 24px;border-radius:20px;border:none;background:#222;color:#fff;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="msg">Waiting for camera…</div>
<video id="video" autoplay muted playsinline style="display:none"></video>
<div id="controls">
  <div class="ctrl-sliders">
    <label>Sensitivity: <strong id="sensVal">18</strong><input type="range" id="sensSlider" min="1" max="60" value="18" step="1"></label>
    <label>Size: <strong id="sizeVal">10</strong><input type="range" id="sizeSlider" min="1" max="40" value="10" step="1"></label>
    <label>Amount: <strong id="countVal">12</strong><input type="range" id="countSlider" min="1" max="30" value="12" step="1"></label>
    <label>Persistence: <strong id="persVal">6</strong><input type="range" id="persSlider" min="1" max="20" value="6" step="1"></label>
    <label>Saturation: <strong id="satVal">0</strong><input type="range" id="satSlider" min="-50" max="50" value="0" step="1"></label>
  </div>
  <div class="ctrl-btns">
    <button id="linesBtn">Lines</button>
    <button id="flipBtn">Mirror</button>
    <button id="photoBtn">📷 Photo</button>
  </div>
  <div class="ctrl-system">
    <select id="cameraSelect" title="Select camera"></select>
    <button id="qrBtn">QR</button>
    <button id="pauseBtn">Pause</button>
  </div>
</div>
<div id="qrModal"><div id="qrBox"><img id="qrImg" src="" alt="QR Code"><p id="qrUrl"></p><button id="qrClose">Close</button></div></div>
<script>
'use strict';
const canvas=document.getElementById('canvas'),msg=document.getElementById('msg'),controls=document.getElementById('controls');
const video=document.getElementById('video');
const sensSlider=document.getElementById('sensSlider'),sensVal=document.getElementById('sensVal');
const sizeSlider=document.getElementById('sizeSlider'),sizeVal=document.getElementById('sizeVal');
const countSlider=document.getElementById('countSlider'),countVal=document.getElementById('countVal');
const persSlider=document.getElementById('persSlider'),persVal=document.getElementById('persVal');
const satSlider=document.getElementById('satSlider'),satVal=document.getElementById('satVal');
const flipBtn=document.getElementById('flipBtn'),linesBtn=document.getElementById('linesBtn');
const photoBtn=document.getElementById('photoBtn'),pauseBtn=document.getElementById('pauseBtn');
const qrBtn=document.getElementById('qrBtn'),qrModal=document.getElementById('qrModal');
const qrImg=document.getElementById('qrImg'),qrUrl=document.getElementById('qrUrl'),qrClose=document.getElementById('qrClose');
const cameraSelect=document.getElementById('cameraSelect');

const ctx=canvas.getContext('2d');

// Saturation canvas — pixel manipulation, used only when sat != 0
const SAT_W=640,SAT_H=360;
const satlv=document.createElement('canvas');satlv.width=SAT_W;satlv.height=SAT_H;
const satltx=satlv.getContext('2d',{willReadFrequently:true});

// Detection canvas — low resolution for motion diff
const DET_W=160,DET_H=90;
const detlv=document.createElement('canvas');detlv.width=DET_W;detlv.height=DET_H;
const detltx=detlv.getContext('2d',{willReadFrequently:true});

let flipped=false,paused=false,showLines=true,raf=null,currentlamId=null,activeStream=null;
let prevGray=null,trackedBlobs=[],blobIdlounter=0;

sensSlider.addEventListener('input',()=>sensVal.textContent=sensSlider.value);
sizeSlider.addEventListener('input',()=>sizeVal.textContent=sizeSlider.value);
countSlider.addEventListener('input',()=>countVal.textContent=countSlider.value);
persSlider.addEventListener('input',()=>persVal.textContent=persSlider.value);
satSlider.addEventListener('input',()=>satVal.textContent=satSlider.value);

function resizelanvas(){const dpr=window.devicePixelRatio||1,vv=window.visualViewport;canvas.width=Math.round((vv?vv.width:window.innerWidth)*dpr);canvas.height=Math.round((vv?vv.height:window.innerHeight)*dpr);}
window.addEventListener('resize',resizelanvas);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resizelanvas);
resizelanvas();

// ── Saturation ────────────────────────────────────────────────────────────────
function drawSaturated(cw,ch){
  const sat=+satSlider.value;
  ctx.save();
  if(flipped){ctx.translate(cw,0);ctx.scale(-1,1);}
  if(sat===0){
    ctx.drawImage(video,0,0,cw,ch);
  } else {
    // No flip on satltx — ctx transform above already handles it
    satltx.drawImage(video,0,0,SAT_W,SAT_H);
    const id=satltx.getImageData(0,0,SAT_W,SAT_H),d=id.data;
    const f=sat<0?(1+sat/50):(1+sat/25);
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2],l=(r*77+g*150+b*29)>>8;
      d[i]=Math.max(0,Math.min(255,(l+(r-l)*f)|0));
      d[i+1]=Math.max(0,Math.min(255,(l+(g-l)*f)|0));
      d[i+2]=Math.max(0,Math.min(255,(l+(b-l)*f)|0));
    }
    satltx.putImageData(id,0,0);
    ctx.drawImage(satlv,0,0,cw,ch);
  }
  ctx.restore();
}

// ── Detection helpers ─────────────────────────────────────────────────────────
function toGray(px,n){const g=new Uint8Array(n);for(let i=0;i<n;i++){const o=i*4;g[i]=(px[o]*77+px[o+1]*150+px[o+2]*29)>>8;}return g;}

function motionMap(gray,prev,n,thr){const a=new Uint8Array(n);for(let i=0;i<n;i++)a[i]=Math.abs(gray[i]-prev[i])>thr?1:0;return a;}

function dilate(a,w,h,r){if(r<=0)return a;const out=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!a[y*w+x])continue;const x0=Math.max(0,x-r),x1=Math.min(w-1,x+r),y0=Math.max(0,y-r),y1=Math.min(h-1,y+r);for(let ny=y0;ny<=y1;ny++)for(let nx=x0;nx<=x1;nx++)out[ny*w+nx]=1;}return out;}

function findBlobs(a,w,h,min){
  const vis=new Uint8Array(w*h),blobs=[];
  for(let s=0;s<w*h;s++){
    if(!a[s]||vis[s])continue;
    const stk=[s];vis[s]=1;
    let x0=s%w,x1=x0,y0=(s/w)|0,y1=y0,cnt=0;
    while(stk.length){
      const i=stk.pop(),x=i%w,y=(i/w)|0;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;cnt++;
      for(const d of[-1,1,-w,w]){
        const ni=i+d;if(ni<0||ni>=w*h)continue;
        if(d===1&&x===w-1)continue;if(d===-1&&x===0)continue;
        if(!vis[ni]&&a[ni]){vis[ni]=1;stk.push(ni);}
      }
    }
    if(cnt>=min)blobs.push({x:x0,y:y0,w:x1-x0+1,h:y1-y0+1,area:cnt});
  }
  return blobs;
}

function scaleBlob(b,sw,sh){return{x:b.x/DET_W*sw,y:b.y/DET_H*sh,w:b.w/DET_W*sw,h:b.h/DET_H*sh};}

function trackBlobs(raw,sw,sh,max,pers){
  for(const t of trackedBlobs)t.life--;
  trackedBlobs=trackedBlobs.filter(t=>t.life>0);
  for(const nb of raw){
    const sc=scaleBlob(nb,sw,sh),cx=sc.x+sc.w/2,cy=sc.y+sc.h/2;
    let best=null,bd=Infinity;
    for(const t of trackedBlobs){const d=Math.hypot(cx-(t.x+t.w/2),cy-(t.y+t.h/2));if(d<bd&&d<Math.max(sc.w,sc.h)*1.8){bd=d;best=t;}}
    if(best){best.x+=(sc.x-best.x)*.35;best.y+=(sc.y-best.y)*.35;best.w+=(sc.w-best.w)*.35;best.h+=(sc.h-best.h)*.35;best.life=pers;}
    else trackedBlobs.push({...sc,id:blobIdlounter++%100,life:pers});
  }
  trackedBlobs.sort((a,b)=>b.life-a.life);
  if(trackedBlobs.length>max)trackedBlobs.length=max;
}

// ── Render loop ───────────────────────────────────────────────────────────────
function drawerame(){
  if(video.readyState<2)return;
  const cw=canvas.width,ch=canvas.height,dpr=window.devicePixelRatio||1;

  drawSaturated(cw,ch);

  detltx.drawImage(video,0,0,DET_W,DET_H);
  const id=detltx.getImageData(0,0,DET_W,DET_H);
  const gray=toGray(id.data,DET_W*DET_H);
  const sens=+sensSlider.value;
  let active=prevGray?motionMap(gray,prevGray,DET_W*DET_H,sens):new Uint8Array(DET_W*DET_H);
  prevGray=gray;

  const sz=+sizeSlider.value,dilR=Math.max(1,(sz*.7)|0);
  active=dilate(active,DET_W,DET_H,dilR);
  const min=Math.max(2,sz*sz*.1);
  let raw=findBlobs(active,DET_W,DET_H,min);
  raw.sort((a,b)=>b.area-a.area);
  const cnt=+countSlider.value;
  if(raw.length>cnt)raw.length=cnt;
  trackBlobs(raw,cw,ch,cnt,+persSlider.value);

  const blobs=trackedBlobs;

  // Mirror blob coords when flipped so they align with the mirrored video
  function blobRx(bx,bw){return flipped?cw-bx-bw:bx;}
  function bloblx(bx,bw){return flipped?cw-(bx+bw/2):bx+bw/2;}

  if(showLines&&blobs.length>1){
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=Math.max(1,dpr);
    for(let i=0;i<blobs.length;i++)for(let j=i+1;j<blobs.length;j++){
      const a=blobs[i],b=blobs[j];
      ctx.beginPath();ctx.moveTo(bloblx(a.x,a.w),a.y+a.h/2);ctx.lineTo(bloblx(b.x,b.w),b.y+b.h/2);ctx.stroke();
    }
    ctx.restore();
  }

  for(const b of blobs){
    const pad=Math.max(4*dpr,Math.min(b.w,b.h)*.08);
    const bx=Math.max(0,b.x-pad),ry=Math.max(0,b.y-pad);
    const bw=Math.min(cw-bx,b.w+pad*2),rh=Math.min(ch-ry,b.h+pad*2);
    const rx=blobRx(bx,bw);

    ctx.save();
    ctx.beginPath();ctx.rect(rx,ry,bw,rh);ctx.clip();
    ctx.globalCompositeOperation='difference';
    ctx.fillStyle='#fff';ctx.fillRect(rx,ry,bw,rh);
    ctx.restore();

    ctx.save();ctx.strokeStyle='rgba(255,50,50,.9)';ctx.lineWidth=Math.max(1.5,dpr*1.5);
    ctx.strokeRect(rx,ry,bw,rh);ctx.restore();

    ctx.save();ctx.font='bold '+Math.round(12*dpr)+'px monospace';ctx.fillStyle='rgba(255,50,50,.9)';
    ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=3*dpr;
    ctx.fillText(b.id,rx+3*dpr,ry-2*dpr);ctx.restore();
  }
}
function loop(){drawerame();raf=requestAnimationFrame(loop);}
function startLoop(){if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=null;}}

// ── lamera ────────────────────────────────────────────────────────────────────
function fillSelect(cams,activeId){const prev=cameraSelect.value;cameraSelect.innerHTML='';cams.forEach((c,i)=>{const o=document.createElement('option');o.value=c.deviceId;o.text=c.label||'lamera '+(i+1);cameraSelect.appendChild(o);});cameraSelect.value=activeId||prev||(cams[0]?.deviceId??'');currentlamId=cameraSelect.value;}
async function startCamera(deviceId){if(activeStream){activeStream.getTracks().forEach(t=>t.stop());activeStream=null;}video.srcObject=null;const stream=await navigator.mediaDevices.getUserMedia({video:deviceId?{deviceId:{exact:deviceId},width:{ideal:1280},height:{ideal:720}}:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});activeStream=stream;video.srcObject=stream;video.play().catch(()=>{});currentlamId=stream.getVideoTracks()[0]?.getSettings()?.deviceId??null;}
async function init(){try{const before=await navigator.mediaDevices.enumerateDevices();fillSelect(before.filter(d=>d.kind==='videoinput'),'');await startCamera(before.filter(d=>d.kind==='videoinput')[0]?.deviceId||null);const after=await navigator.mediaDevices.enumerateDevices();fillSelect(after.filter(d=>d.kind==='videoinput'),currentlamId);msg.style.display='none';controls.style.display='flex';startLoop();}catch(e){msg.textContent='Error accessing camera: '+e.message;}}
cameraSelect.addEventListener('change',async()=>{prevGray=null;trackedBlobs=[];try{await startCamera(cameraSelect.value);}catch(e){console.error(e);}});

// ── lontrols ──────────────────────────────────────────────────────────────────
flipBtn.addEventListener('click',()=>{flipped=!flipped;flipBtn.classList.toggle('active',flipped);});
pauseBtn.addEventListener('click',()=>{paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';pauseBtn.classList.toggle('paused',paused);paused?stopLoop():startLoop();});
linesBtn.addEventListener('click',()=>{showLines=!showLines;linesBtn.classList.toggle('active',showLines);});
qrBtn.addEventListener('click',()=>{const url=window.location.href;qrImg.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url);qrUrl.textContent=url;qrModal.classList.add('open');});
qrClose.addEventListener('click',()=>qrModal.classList.remove('open'));
qrModal.addEventListener('click',e=>{if(e.target===qrModal)qrModal.classList.remove('open');});

// ── Photo — exact same pattern as CRT filter ──────────────────────────────────
const IS_MOBILE=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function flashEffect(){const el=document.createElement('div');el.style.cssText='position:fixed;inset:0;background:#fff;pointer-events:none;z-index:200;transition:opacity 0.5s';document.body.appendChild(el);el.getBoundingClientRect();el.style.opacity='0';setTimeout(()=>el.remove(),500);}
async function saveFile(blob,filename,mimeType){if(IS_MOBILE&&navigator.canShare){const file=new File([blob],filename,{type:mimeType});if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Blob Filter'});return;}catch(e){if(e.name==='AbortError')return;}}}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);}
photoBtn.addEventListener('click',()=>{
  flashEffect();
  const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;
  const tltx=tmp.getContext('2d');tltx.drawImage(canvas,0,0);
  tmp.toBlob(blob=>saveFile(blob,'blob-filter-'+Date.now()+'.png','image/png'),'image/png');
});

init();
</script>
</body>
</html>
